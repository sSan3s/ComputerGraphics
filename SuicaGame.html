<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <script id="vertex-shader" type="x-shader/x-vertex">
            attribute vec4 vPosition;
            attribute vec4 vColor;

            varying vec4 fColor;

            void main(){
                gl_Position = vPosition;
                fColor = vColor;
            }
        </script>
        
    <style type="text/css">
        body { font: 13px/140% Arial, sans-serif; background: gray; color: white; overflow: hidden; }
        a { color: inherit; cursor: pointer; }
        img { display: none; }
        h1 { font: bold italic 30px/30px Georgia; text-align: center; }
        h2 { font: bold italic 17px/17px Georgia; padding-top: 10px; }
        canvas { position: absolute; top: 0; left: 0; }
        #instructions { position: absolute; top: 0; right: 0; bottom: 0; width: 280px; padding-right: 20px; overflow: auto; }
        #loading { position: absolute; left: 0; top: 50%; right: 300px; text-align: center; margin-top: -8px; }
        @media (max-width: 600px) {
        #instructions { width: 100px; font-size: 10px; line-height: 12px; }
        }
    </style>
</head>

<script type="text/javascript" src="JSFiles/webgl-utils.js"></script>
<script type="text/javascript" src="JSFiles/initShaders.js"></script>
<script type="text/javascript" src="JSFiles/MV.js"></script>
<script type="text/javascript" src="JSFiles/CubeMap.js"></script>

<body>
<div id="loading"></div>
<div id="instructions">
    <h1>Suica 3D Game</h1>
    <p>How to play..</p>
</div>
<img id="tiles" src="tiles.jpg">

<canvas id="gl-canvas" width="690" height="755" style="width:690px; height:755px;">

</canvas>


</body>
</html>
